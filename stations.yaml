    direction_keyword: "尾張瀬戸"
    destination: "尾張瀬戸"
    fallback: manual
    enabled: true

  - id: meitetsu-seto-sakaemachi-owariseto
    name: 栄町
    line: 名鉄瀬戸線
    direction: 尾張瀬戸方面
