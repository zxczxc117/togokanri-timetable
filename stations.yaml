# ================================================================
# 配信する駅の定義。ブラウザ上でこのファイルを開き、鉛筆アイコンで直せる。
#
#  id                半角英数とハイフンのみ。一度決めたら変えない（アプリの登録キー）
#  name              駅名
#  line              路線名
#  direction         方面（表示名）
#  operator          事業者
#  adapter           取得方法: meitetsu / jrcentral / nagoya_subway / yahoo / manual
#  url               取得元URL（adapter が使う）
#  direction_keyword ページ内で方面を選ぶ文字
#  destination       行先の既定表示（空なら取得結果を使う）
#  fallback          自動取得が失敗したときの保険: manual / yahoo / none
#  enabled           false にすると配信対象から外す
#
# ※同梱の manual データは代表値のサンプル。運用前に必ず公式時刻表で置き換えること。
# ================================================================
stations:
  # ---------- 名鉄瀬戸線 ----------
  - id: meitetsu-seto-moriyama-sakaemachi
    name: 守山自衛隊前
    line: 名鉄瀬戸線
    direction: 栄町方面
    operator: 名古屋鉄道
    adapter: meitetsu
    url: "https://trainbus.meitetsu.co.jp/meitetsu-transfer/pc/diagram/TrainDiagram?startId=00003449&linkId=00000871&direction=up"
    direction_keyword: "栄町"
    destination: "栄町"
    fallback: manual
    enabled: true

  - id: meitetsu-seto-moriyama-owariseto
    name: 守山自衛隊前
    line: 名鉄瀬戸線
    direction: 尾張瀬戸方面
